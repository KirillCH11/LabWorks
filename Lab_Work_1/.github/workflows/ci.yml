name: BMP Image Processor CI

on:
  push:
    paths:
      - 'Lab_Work_1/**'
  pull_request:
    paths:
      - 'Lab_Work_1/**'

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v3
    
    - name: Install dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y g++ libomp-dev build-essential make
        
    - name: Build using Makefile
      run: |
        make
        
    - name: Prepare test images
      run: |
        mkdir -p test_images
        cp Panda_small.bmp Panda_middle.bmp Panda_large.bmp test_images/
        ls -lh test_images/
        
    - name: Run performance tests
      run: |
        ./bmp_processor test_images/Panda_small.bmp small_rotated.bmp small_filtered.bmp
        ./bmp_processor test_images/Panda_middle.bmp middle_rotated.bmp middle_filtered.bmp
        ./bmp_processor test_images/Panda_large.bmp large_rotated.bmp large_filtered.bmp
        ls -lh *.bmp
        
    - name: Verify outputs
      run: |
        file small_rotated.bmp small_filtered.bmp
        file middle_rotated.bmp middle_filtered.bmp
        file large_rotated.bmp large_filtered.bmp
